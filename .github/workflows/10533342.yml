name: Build and deploy .NET Core application to Web App 10533342
on:
  push:
    branches:
      - main
permissions:
  id-token: write
  contents: read
env:
  AZURE_WEBAPP_NAME: 10533342
  AZURE_WEBAPP_PACKAGE_PATH: .\published
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 8.0.x
  # The app lives in a subfolder, so every dotnet command targets its .csproj directly.
  # (The .slnx solution format needs a newer SDK than 8.0.x, so it isn't used here.)
  PROJECT_PATH: 10533342-AgriStreamIOT-Akonaho-Ravhura/10533342-AgriStreamIOT-Akonaho-Ravhura.csproj
jobs:
  build:
    environment: _10533342_Env
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_CORE_VERSION }}
      - name: Restore
        run: dotnet restore "${{ env.PROJECT_PATH }}"
      - name: Build
        run: dotnet build "${{ env.PROJECT_PATH }}" --configuration ${{ env.CONFIGURATION }} --no-restore
      # No test project exists yet; add a "Test" step (dotnet test <tests.csproj>) once one does.
      - name: Publish
        run: dotnet publish "${{ env.PROJECT_PATH }}" --configuration ${{ env.CONFIGURATION }} --no-build --output "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}"
      - name: Publish Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
  deploy:
    environment: _10533342_Env
    runs-on: windows-latest
    needs: build
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars._10533342_CLIENT_ID_C162 }}
          tenant-id: ${{ vars._10533342_TENANT_ID_C162 }}
          subscription-id: ${{ vars._10533342_SUBSCRIPTION_ID_C162 }}
      - name: Deploy to Azure WebApp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}